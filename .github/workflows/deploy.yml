name: Deploy Greglabs-plat to ians-lab

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t greg-labs/greglabs-plat:latest .

      - name: Save image
        run: docker save greg-labs/greglabs-plat:latest | gzip > greglabs-plat.tar.gz

      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with: 
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: greglabs-plat.tar.gz
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            docker load < greglabs-plat.tar.gz
            docker compose up -d
            docker image prune -f